<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101A3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flex 14">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Flex 14</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500;600&display=swap">
<style>
/* Layout: one narrow column like a yoga mat, big light numerals, picture-led stretch cards, a bottom tab bar, and a full-screen breathing timer. */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --ink:#101A3D; --muted:#58628A; --line:#D3DAE8;
  --accent:#E4571B; --accent-ink:#FFFFFF; --tint:#DCE6F7; --ok:#1C8458; --paper:#F5F1E8;
  --font:"Helvetica Neue","HelveticaNeue-Light","Hanken Grotesk",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1226; --surface:#151C36; --ink:#ECEFF8; --muted:#9AA4C4; --line:#26304F;
    --accent:#FF7A3D; --accent-ink:#170A02; --tint:#1F2B4F; --ok:#4CC38A; --paper:#F5F1E8; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1226; --surface:#151C36; --ink:#ECEFF8; --muted:#9AA4C4; --line:#26304F;
  --accent:#FF7A3D; --accent-ink:#170A02; --tint:#1F2B4F; --ok:#4CC38A; --paper:#F5F1E8; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font); font-weight:300; font-size:16px; line-height:1.5;
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-weight:300;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums;font-weight:200}

/* Top */
.top{display:flex;justify-content:space-between;align-items:center;padding-block:18px 6px}
.brand{font-size:15px;font-weight:500;letter-spacing:.02em}
.brand i{font-style:normal;color:var(--accent)}
.theme{font-size:12px;color:var(--muted);padding:6px 10px;border:1px solid var(--line);border-radius:999px}

/* Today */
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:14px 8px}
.bignum{font-size:112px;line-height:.9;font-weight:200;letter-spacing:-.03em}
.bignum small{font-size:28px;color:var(--muted);letter-spacing:0;margin-left:4px}
.daynav{display:flex;gap:8px;padding-bottom:6px}
.daynav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.daynav button:disabled{opacity:.35;cursor:default}
.dateline{font-size:18px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-block:14px}
.chip{font-size:13px;padding:5px 12px;border-radius:999px;background:var(--tint)}
.chip b{font-weight:500}
.prog{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.proglabel{font-size:12px;color:var(--muted);margin-bottom:14px}

.list{background:var(--surface);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px 10px 10px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row img{width:64px;height:48px;object-fit:cover;border-radius:6px;background:var(--paper)}
.row .t{font-size:16px;font-weight:400;line-height:1.25}
.row .s{font-size:12px;color:var(--muted)}
.row .c{font-size:22px;text-align:right;line-height:1}
.row .c small{display:block;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:18px;padding:18px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-size:18px;font-weight:500;letter-spacing:.02em}
.cta.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:10px;font-size:15px;font-weight:400;padding:14px}
.note{font-size:13px;color:var(--muted);margin-top:12px}

/* Library */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
.card .pic{background:var(--paper);display:block;width:100%}
.card .body{padding:16px 16px 18px;display:grid;gap:14px}
.card h3{font-size:24px;line-height:1.15}
.card .es{font-size:13px;color:var(--muted);margin-top:2px}
.badge{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:500;font-size:15px;margin-bottom:8px}
.hold{display:flex;gap:10px;align-items:baseline;padding:10px 12px;background:var(--tint);border-radius:10px}
.hold .n{font-size:34px;line-height:1}
.hold span{font-size:13px}
.card h4{margin:0 0 6px;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card ol{margin:0;padding-left:20px;display:grid;gap:6px}
.card p{margin:0}
.pageh{padding-block:12px 14px}
.pageh h1{font-size:34px;line-height:1.1}
.pageh p{color:var(--muted);margin:6px 0 0;font-size:15px}

/* Plan */
.week{margin-block:20px 10px;display:flex;justify-content:space-between;align-items:baseline}
.week h2{font-size:22px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.tile{position:relative;display:grid;justify-items:center;gap:0;padding:8px 0 7px;border-radius:10px;background:var(--surface);border:1px solid var(--line);min-width:0}
.tile .w{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .d{font-size:26px;line-height:1.1;font-weight:200}
.tile .m{font-size:10px;color:var(--muted)}
.tile .p{font-size:10px;font-weight:500;margin-top:3px;color:var(--accent)}
.tile[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tile.done{background:var(--tint)}
.tile.done .p{color:var(--ok)}
.rules{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.rules li{padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-size:15px}
.rules b{font-weight:500}
.goal{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--paper)}
.goal img{display:block;width:100%}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.field input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.sect{margin-block:26px 10px;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(12px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.tabs div{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-width:560px;margin:0 auto}
.tabs a{display:grid;justify-items:center;gap:2px;padding:8px 4px;border-radius:10px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:400}
.tabs a[aria-current="page"]{color:var(--accent);font-weight:500}
.tabs svg{width:22px;height:22px}

/* Session */
#session{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.s-in{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-block:12px 16px;min-height:100%}
.s-top{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px}
.ibtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.ibtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.s-title{text-align:center;min-width:0}
.s-title b{display:block;font-size:20px;font-weight:400;line-height:1.2}
.s-pic{background:var(--paper);border-radius:12px;overflow:hidden;flex:0 1 auto;max-height:30vh;display:grid;place-items:center}
.s-pic img{max-height:30vh;max-width:100%;display:block;margin:0 auto}
.s-side{text-align:center;min-height:22px;font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.ringwrap{display:grid;place-items:center}
.ring{position:relative;width:min(70vw,290px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--line)}
.ring .bar{stroke:var(--accent);transition:stroke-dashoffset .12s linear}
.disc{position:absolute;inset:11%;border-radius:50%;background:var(--tint);transform:scale(.86);transition:transform 2.4s ease-in-out}
.mid{position:relative;text-align:center;display:grid;gap:0;justify-items:center}
#num{font-size:clamp(72px,24vw,104px);line-height:1;font-weight:200;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#lab{font-size:15px;font-weight:500;letter-spacing:.1em;text-transform:uppercase}
#sub{font-size:12px;color:var(--muted);margin-top:2px;min-height:18px}
.s-cue{text-align:center;font-size:15px;color:var(--muted);min-height:44px;text-wrap:balance}
.s-row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.pace{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px}
.pace button{min-width:40px;height:36px;border-radius:999px;font-size:14px;color:var(--muted)}
.pace button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:500}
.pacelabel{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center}
.dots{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:auto;padding-top:6px}
.dots i{height:4px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--ink)}
.dots i.now{background:var(--accent)}

@media (prefers-reduced-motion:reduce){.disc,.ring .bar,.prog i{transition:none}}
@media (max-height:700px){.s-pic,.s-pic img{max-height:22vh}}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="top">
    <div class="brand">Flex <i>14</i></div>
    <button class="theme" id="themeBtn" type="button">Theme</button>
  </div>

  <section id="v-today" hidden></section>
  <section id="v-lib" hidden></section>
  <section id="v-plan" hidden></section>
</div>

<nav class="tabs" aria-label="Sections"><div>
  <a href="#today" id="t-today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Today</a>
  <a href="#stretches" id="t-lib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><path d="M5 9l7 2 7-2M12 11v4l-4 6M12 15l4 6"/></svg>Stretches</a>
  <a href="#plan" id="t-plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>14 days</a>
</div></nav>

<div id="session" hidden role="dialog" aria-label="Guided session"><div class="s-in">
  <div class="s-top">
    <button class="ibtn" id="sClose" type="button" aria-label="Close session"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="s-title"><span class="eyebrow" id="sStep">Get ready</span><b id="sName">&nbsp;</b></div>
    <button class="ibtn" id="sVoice" type="button" aria-pressed="true" aria-label="Voice coach"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11"/></svg></button>
  </div>
  <div class="s-pic"><img id="sImg" alt=""></div>
  <div class="s-side" id="sSide"></div>
  <div class="ringwrap">
    <button class="ring" id="ring" type="button" aria-label="Start">
      <svg viewBox="0 0 220 220"><circle class="track" cx="110" cy="110" r="102" fill="none" stroke-width="4"/><circle class="bar" id="bar" cx="110" cy="110" r="102" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="640.9" stroke-dashoffset="640.9"/></svg>
      <span class="disc" id="disc"></span>
      <span class="mid"><span id="num">10</span><span id="lab">Get ready</span><span id="sub">Tap to start</span></span>
    </button>
  </div>
  <div class="s-cue" id="sCue"></div>
  <div class="s-row">
    <button class="ibtn" id="sPrev" type="button" aria-label="Previous stretch"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5L8 12l10 7zM6 5v14"/></svg></button>
    <div>
      <div class="pacelabel">Seconds per breath</div>
      <div class="pace" id="pace" role="group" aria-label="Seconds per breath"></div>
    </div>
    <button class="ibtn" id="sNext" type="button" aria-label="Next stretch"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5l10 7-10 7zM18 5v14"/></svg></button>
  </div>
  <div class="dots" id="dots"></div>
</div></div>

var MULT=[.6,.6,.7,.7,.8,.8,.7,.9,.9,1,1,1.15,1.15,1.15];
var WEEKN=["Build the habit","Go deeper"];
var PACES=[4,5,6,7,8,10];

/* storage */
function lsGet(k,d){try{var v=localStorage.getItem("flex14:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem("flex14:"+k,JSON.stringify(v))}catch(e){}}

function pad(n){return n<10?"0"+n:""+n}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);return x}
var today=new Date(); today=new Date(today.getFullYear(),today.getMonth(),today.getDate());

var startStr=lsGet("start",null);
if(!startStr){startStr=ymd(addDays(today,1));}
var done=lsGet("done",{});
var pace=lsGet("pace",6);
var voiceOn=lsGet("voice",true);

function startDate(){return parse(startStr)}
function curDay(){
  var diff=Math.round((today-startDate())/86400000)+1;
  return Math.min(14,Math.max(1,diff));
}
var sel=curDay();

function fmt(d,o){try{return new Intl.DateTimeFormat("en-AU",o).format(d)}catch(e){return d.toDateString()}}
function dayDate(n){return addDays(startDate(),n-1)}
function breaths(i,day){return Math.max(4,Math.round(ST[i].base*MULT[day-1]))}
function totalMs(day){
  var ms=10000;
  for(var i=0;i<9;i++){
    var b=breaths(i,day);
    ms+=b*pace*1000*(ST[i].side?2:1);
    ms+=ST[i].side?5000:0;
    if(i<8)ms+=8000;
  }
  return ms;
}
function totalBreaths(day){var t=0;for(var i=0;i<9;i++)t+=breaths(i,day)*(ST[i].side?2:1);return t}
function countText(i,day){var b=breaths(i,day);return ST[i].side?b+" per side":b+" breaths"}
function doneCount(){var c=0;for(var k in done)if(done[k])c++;return c}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

/* today view */
var vToday=document.getElementById("v-today");
function renderToday(){
  var d=dayDate(sel), pct=Math.round(MULT[sel-1]*100), mins=Math.round(totalMs(sel)/60000);
  var isDone=!!done[sel];
  var rel=Math.round((dayDate(sel)-today)/86400000);
  var when=rel===0?"Today":rel===1?"Tomorrow":rel===-1?"Yesterday":"";
  var rows="";
  for(var i=0;i<9;i++){
    var b=breaths(i,sel);
    rows+='<button class="row" type="button" data-open="'+i+'"><img src="'+IMG[i]+'" alt="" loading="lazy"><span><span class="t">'+(i+1)+'. '+esc(ST[i].n)+'</span><br><span class="s">'+esc(ST[i].use)+'</span></span><span class="c num">'+b+'<small>'+(ST[i].side?"per side":"breaths")+'</small></span></button>';
  }
  vToday.innerHTML=
   '<div class="dayhead"><div><div class="eyebrow">Day '+sel+' of 14'+(when?' · '+when:'')+'</div>'+
   '<div class="bignum num">'+sel+'<small>/14</small></div>'+
   '<div class="dateline">'+esc(fmt(d,{weekday:"long",day:"numeric",month:"long"}))+'</div></div>'+
   '<div class="daynav"><button type="button" id="dPrev" aria-label="Previous day"'+(sel===1?' disabled':'')+'><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>'+
   '<button type="button" id="dNext" aria-label="Next day"'+(sel===14?' disabled':'')+'><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></div></div>'+
   '<div class="chips"><span class="chip"><b>'+mins+' min</b> at '+pace+' s per breath</span><span class="chip"><b>'+pct+'%</b> of full holds</span><span class="chip"><b>'+totalBreaths(sel)+'</b> breaths</span></div>'+
   '<div class="prog"><i style="width:'+Math.round(doneCount()/14*100)+'%"></i></div>'+
   '<div class="proglabel">'+doneCount()+' of 14 days done</div>'+
   '<div class="list">'+rows+'</div>'+
   '<button class="cta" id="startBtn" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>'+(isDone?'Do it again':'Start day '+sel)+'</button>'+
   (isDone?'<button class="cta ghost" id="undoBtn" type="button">Mark day '+sel+' as not done</button>':'')+
   '<p class="note">Warm up for 3 to 5 minutes first: march on the spot, hip circles and gentle leg swings. Stretch to a mild pull, never to pain.</p>';
  document.getElementById("dPrev").onclick=function(){if(sel>1){sel--;renderToday()}};
  document.getElementById("dNext").onclick=function(){if(sel<14){sel++;renderToday()}};
  document.getElementById("startBtn").onclick=function(){openSession(sel)};
  var u=document.getElementById("undoBtn"); if(u)u.onclick=function(){done[sel]=false;lsSet("done",done);renderToday()};
  var els=vToday.querySelectorAll("[data-open]");
  for(var k=0;k<els.length;k++)els[k].onclick=(function(i){return function(){location.hash="stretches-"+(i+1)}})(+els[k].getAttribute("data-open"));
}

/* library */
var vLib=document.getElementById("v-lib");
function renderLib(){
  var h='<div class="pageh"><div class="eyebrow">9 stretches</div><h1>How to do each one</h1><p>Full hold shown below. Early days use fewer breaths, see the 14 days tab.</p></div>';
  for(var i=0;i<9;i++){
    var s=ST[i], secs=s.base*pace;
    h+='<article class="card" id="s'+(i+1)+'"><img class="pic" src="'+IMG[i]+'" alt="'+esc(s.n)+' demonstration"><div class="body">'+
     '<div><span class="badge">'+(i+1)+'</span><h3>'+esc(s.n)+'</h3><div class="es">'+esc(s.es)+'</div></div>'+
     '<div class="hold"><span class="n num">'+s.base+'</span><span>deep breaths'+(s.side?' on each side':'')+'<br>about '+secs+' seconds'+(s.side?' per side':'')+' at '+pace+' s per breath</span></div>'+
     '<div><h4>How to</h4><ol>'+s.how.map(function(x){return "<li>"+esc(x)+"</li>"}).join("")+'</ol></div>'+
     '<div><h4>You should feel</h4><p>'+esc(s.feel)+'</p></div>'+
     '<div><h4>Avoid</h4><p>'+esc(s.avoid)+'</p></div>'+
     '</div></article>';
  }
  vLib.innerHTML=h;
}

/* plan */
var vPlan=document.getElementById("v-plan");
function renderPlan(){
  var h='<div class="pageh"><div class="eyebrow">Two weeks, daily</div><h1>14 day plan</h1><p>Each day uses a share of the full chart holds. The last three days go a little past it.</p></div>';
  for(var w=0;w<2;w++){
    h+='<div class="week"><h2>Week '+(w+1)+'</h2><span class="eyebrow">'+WEEKN[w]+'</span></div><div class="grid">';
    for(var j=1;j<=7;j++){
      var n=w*7+j, d=dayDate(n);
      h+='<button class="tile'+(done[n]?' done':'')+'" type="button" data-day="'+n+'"'+(n===curDay()?' aria-current="true"':'')+' aria-label="Day '+n+', '+Math.round(MULT[n-1]*100)+' percent'+(done[n]?', done':'')+'">'+
         '<span class="w">'+fmt(d,{weekday:"short"}).slice(0,3)+'</span><span class="d num">'+d.getDate()+'</span><span class="m">'+fmt(d,{month:"short"})+'</span><span class="p">'+(done[n]?'Done':Math.round(MULT[n-1]*100)+'%')+'</span></button>';
    }
    h+='</div>';
  }
  h+='<div class="sect">Start date</div><div class="field"><label for="startIn">Day 1 is</label><input type="date" id="startIn" value="'+startStr+'"></div>';
  h+='<div class="sect">Rules for a safe two weeks</div><ul class="rules">'+
   '<li><b>Daily, same time.</b> About 20 minutes. Evening works well once your body is warm.</li>'+
   '<li><b>Warm up first.</b> Stretching warm muscles gives better range than cold ones.</li>'+
   '<li><b>Mild to moderate pull.</b> About 6 out of 10. Sharp, pinching or joint pain means ease off.</li>'+
   '<li><b>Slow breaths.</b> Breathe in through your nose, out slowly, and sink a little deeper on each exhale. Never bounce.</li>'+
   '<li><b>Rest if sore.</b> Heavy soreness means take an easy day and repeat the lighter day before moving on.</li></ul>';
  h+='<div class="sect">The finish line</div><div class="goal"><img src="'+GOAL+'" alt="Wide straddle fold with chest toward the floor"></div>'+
   '<p class="note">This wide straddle fold with the chest toward the floor is your direction. Two weeks of daily work usually brings clear gains. Full splits take longer for many people, so use this pose as a goal to move toward, not a deadline.</p>';
  vPlan.innerHTML=h;
  var t=vPlan.querySelectorAll("[data-day]");
  for(var k=0;k<t.length;k++)t[k].onclick=(function(n){return function(){sel=n;location.hash="today"}})(+t[k].getAttribute("data-day"));
  document.getElementById("startIn").onchange=function(e){
    if(e.target.value){startStr=e.target.value;lsSet("start",startStr);sel=curDay();renderPlan()}
  };
}

/* routing */
var views={today:vToday,stretches:vLib,plan:vPlan};
var tabs={today:"t-today",stretches:"t-lib",plan:"t-plan"};
function route(){
  var h=(location.hash||"#today").slice(1), anchor=null;
  var m=/^stretches-(\d)$/.exec(h);
  if(m){anchor="s"+m[1];h="stretches"}
  if(!views[h])h="today";
  if(h==="today")renderToday();
  if(h==="plan")renderPlan();
  if(h==="stretches")renderLib();
  for(var k in views){views[k].hidden=(k!==h);var a=document.getElementById(tabs[k]);if(k===h)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")}
  if(anchor){var el=document.getElementById(anchor);if(el)el.scrollIntoView()}else window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);

/* theme */
(function(){
  var root=document.documentElement, b=document.getElementById("themeBtn");
  var saved=lsGet("theme",null); if(saved)root.setAttribute("data-theme",saved);
  b.onclick=function(){
    var cur=root.getAttribute("data-theme");
    var isDark=cur?cur==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches;
    var nx=isDark?"light":"dark"; root.setAttribute("data-theme",nx); lsSet("theme",nx);
  };
})();

/* ---------- session ---------- */
var elS=document.getElementById("session"), elRing=document.getElementById("ring"), elBar=document.getElementById("bar");
var elNum=document.getElementById("num"), elLab=document.getElementById("lab"), elSub=document.getElementById("sub");
var elDisc=document.getElementById("disc"), elStep=document.getElementById("sStep"), elName=document.getElementById("sName");
var elSide=document.getElementById("sSide"), elCue=document.getElementById("sCue"), elImg=document.getElementById("sImg");
var elDots=document.getElementById("dots"), elPace=document.getElementById("pace"), elVoice=document.getElementById("sVoice");
var CIRC=640.9;
var S=null, timer=null, actx=null, wake=null;

function buildPhases(day){
  var ph=[{k:"ready",si:0,ms:10000}];
  for(var i=0;i<9;i++){
    var b=breaths(i,day);
    if(ST[i].side){
      ph.push({k:"move",si:i,side:0,b:b});
      ph.push({k:"gap",si:i,why:"switch",ms:5000});
      ph.push({k:"move",si:i,side:1,b:b});
    }else ph.push({k:"move",si:i,side:null,b:b});
    if(i<8)ph.push({k:"gap",si:i+1,why:"next",ms:8000});
  }
  ph.push({k:"done",si:8});
  return ph;
}
function phMs(p){return p.k==="move"?p.b*pace*1000:(p.ms||0)}

function beep(freq,dur){
  if(!actx)return;
  try{
    var o=actx.createOscillator(),g=actx.createGain();
    o.type="sine";o.frequency.value=freq;g.gain.value=.0001;
    o.connect(g);g.connect(actx.destination);
    var t=actx.currentTime;
    g.gain.exponentialRampToValueAtTime(.25,t+.01);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.start(t);o.stop(t+dur+.02);
  }catch(e){}
}
function say(txt){
  if(!voiceOn||!("speechSynthesis" in window))return;
  try{
    var u=new SpeechSynthesisUtterance(txt);u.rate=.88;u.pitch=1;
    var vs=speechSynthesis.getVoices(),v=null;
    for(var i=0;i<vs.length&&!v;i++)if(vs[i].lang==="en-AU")v=vs[i];
    for(var j=0;j<vs.length&&!v;j++)if(/^en/.test(vs[j].lang))v=vs[j];
    if(v)u.voice=v;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}
function requestWake(){try{if(navigator.wakeLock){navigator.wakeLock.request("screen").then(function(w){wake=w}).catch(function(){})}}catch(e){}}
function releaseWake(){try{if(wake){wake.release();wake=null}}catch(e){}}
document.addEventListener("visibilitychange",function(){if(S&&S.running&&document.visibilityState==="visible")requestWake()});

function openSession(day){
  var ph=buildPhases(day);
  S={day:day,ph:ph,i:0,t:0,running:false,last:0,cue:"",lastB:-1,started:false,lastSec:-1};
  elS.hidden=false; document.body.style.overflow="hidden";
  buildPace();
  var dots="";for(var k=0;k<9;k++)dots+="<i></i>";elDots.innerHTML=dots;
  enter(0,true);
}
function closeSession(){
  if(timer){clearInterval(timer);timer=null}
  if(S)S.running=false;
  try{if("speechSynthesis" in window)speechSynthesis.cancel()}catch(e){}
  releaseWake();
  elS.hidden=true; document.body.style.overflow=""; S=null;
  renderToday();
}
function buildPace(){
  elPace.innerHTML="";
  PACES.forEach(function(p){
    var b=document.createElement("button");b.type="button";b.textContent=p;
    b.setAttribute("aria-pressed",p===pace?"true":"false");
    b.onclick=function(){
      if(S){var ph=S.ph[S.i];if(ph.k==="move"){S.t=S.t*p/pace}}
      pace=p;lsSet("pace",p);buildPace();
    };
    elPace.appendChild(b);
  });
}
function enter(i,silent){
  S.i=i;S.t=0;S.lastB=-1;S.cue="";S.lastSec=-1;
  var p=S.ph[i], s=ST[p.si];
  elImg.src=IMG[p.si];elImg.alt=s.n;
  var kids=elDots.children;
  for(var k=0;k<9;k++){kids[k].className=(k<p.si||p.k==="done")?"on":(k===p.si?"now":"")}
  elStep.textContent=p.k==="done"?"Finished":"Stretch "+(p.si+1)+" of 9";
  elName.textContent=p.k==="done"?"Well done":s.n;
  elCue.textContent=s.cue;
  if(p.k==="move"){
    elSide.textContent=p.side===null?"":(p.side===0?"First side":"Second side");
    elLab.textContent="Breathe in";
    if(!silent)say(s.n+(p.side===null?"":p.side===0?", first side":", second side")+(p.side===1?"":". "+s.cue));
    else if(p.side===1)say("Second side");
  }else if(p.k==="gap"){
    elSide.textContent=p.why==="switch"?"Switch sides":"Next up";
    elName.textContent=p.why==="switch"?s.n:s.n;
    elLab.textContent=p.why==="switch"?"Switch":"Rest";
    if(!silent)say(p.why==="switch"?"Switch sides":"Rest. Next, "+s.n);
  }else if(p.k==="ready"){
    elSide.textContent="";elLab.textContent="Get ready";elName.textContent="Get on your mat";elStep.textContent="Starting with";
    elCue.textContent="First up: "+ST[0].n+". "+ST[0].cue;
  }else{
    elSide.textContent="";elLab.textContent="Session complete";
    done[S.day]=true;lsSet("done",done);
    elNum.textContent="✓";elSub.textContent="Day "+S.day+" done";elBar.style.strokeDashoffset="0";
    elDisc.style.transform="scale(.86)";
    elCue.textContent="Take a few easy breaths and drink some water.";
    S.running=false;if(timer){clearInterval(timer);timer=null}releaseWake();
    say("Session complete. Well done.");
    elRing.setAttribute("aria-label","Close");
    return;
  }
  elRing.setAttribute("aria-label",S.running?"Pause":(S.started?"Resume":"Start"));
  paint();
}
function paint(){
  var p=S.ph[S.i];if(p.k==="done")return;
  var ms=phMs(p), prog=Math.min(1,S.t/ms);
  elBar.style.strokeDashoffset=String(CIRC*(1-prog));
  if(p.k==="move"){
    var cyc=pace*1000, bi=Math.min(p.b-1,Math.floor(S.t/cyc)), pos=(S.t-bi*cyc)/cyc;
    elNum.textContent=p.b-bi;
    var inh=pos<.4, want=inh?"Breathe in":"Breathe out";
    if(S.cue!==want){
      S.cue=want;elLab.textContent=want;
      elDisc.style.transitionDuration=(inh?cyc*.4:cyc*.6)/1000+"s";
      elDisc.style.transform=inh?"scale(1)":"scale(.86)";
    }
    elSub.textContent=(bi+1)+" of "+p.b+" breaths";
    if(bi!==S.lastB){
      S.lastB=bi;
      if(S.started&&S.running&&p.b-bi<=3)beep(p.b-bi===1?880:660,.18);
    }
  }else{
    var left=Math.ceil((ms-S.t)/1000);elNum.textContent=Math.max(0,left);
    elSub.textContent=p.k==="ready"?"seconds":"seconds";
    if(left!==S.lastSec){S.lastSec=left;if(S.running&&left<=3&&left>0)beep(520,.12)}
    elDisc.style.transform="scale(.86)";
  }
}
function tick(){
  if(!S||!S.running)return;
  var now=performance.now(),dt=Math.min(300,now-S.last);S.last=now;S.t+=dt;
  var p=S.ph[S.i];
  if(S.t>=phMs(p)){
    if(p.k==="move")beep(440,.35);
    enter(S.i+1,false);return;
  }
  paint();
}
function toggle(){
  if(!S)return;
  var p=S.ph[S.i];
  if(p.k==="done"){closeSession();return}
  if(!actx){try{var AC=window.AudioContext||window.webkitAudioContext;if(AC)actx=new AC()}catch(e){}}
  if(actx&&actx.state==="suspended"){try{actx.resume()}catch(e){}}
  if(S.running){
    S.running=false;clearInterval(timer);timer=null;releaseWake();
    elSub.textContent="Paused. Tap to resume";elRing.setAttribute("aria-label","Resume");
    try{if("speechSynthesis" in window)speechSynthesis.cancel()}catch(e){}
  }else{
    var first=!S.started;
    S.running=true;S.started=true;S.last=performance.now();
    timer=setInterval(tick,100);requestWake();
    elRing.setAttribute("aria-label","Pause");
    if(first){beep(520,.1);say("Get ready. We start with "+ST[0].n)}
    paint();
  }
}
function skip(dir){
  if(!S)return;
  var ph=S.ph,i=S.i,j;
  if(dir>0){
    j=i+1;while(j<ph.length&&ph[j].k==="gap")j++;
    if(j>=ph.length)j=ph.length-1;
    if(ph[i].k==="ready"||ph[i].k==="move"||ph[i].k==="gap")enter(j,false);
  }else{
    if(ph[i].k==="move"&&S.t>3000){enter(i,false);return}
    j=i-1;while(j>0&&ph[j].k!=="move")j--;
    if(j<0)j=0;enter(j,false);
  }
}
elRing.onclick=toggle;
document.getElementById("sClose").onclick=closeSession;
document.getElementById("sPrev").onclick=function(){skip(-1)};
document.getElementById("sNext").onclick=function(){skip(1)};
function setVoiceBtn(){elVoice.setAttribute("aria-pressed",voiceOn?"true":"false")}
elVoice.onclick=function(){
  voiceOn=!voiceOn;lsSet("voice",voiceOn);setVoiceBtn();
  if(!voiceOn){try{if("speechSynthesis" in window)speechSynthesis.cancel()}catch(e){}}
};
setVoiceBtn();
document.addEventListener("keydown",function(e){
  if(!S||elS.hidden)return;
  if(e.key==="Escape")closeSession();
  if(e.key===" "&&document.activeElement!==elRing){e.preventDefault();toggle()}
});

route();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
})();
</script>
